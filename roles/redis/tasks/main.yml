- name: Установить Redis
  apt:
    name: redis-server
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"
  
- name: Создать каталог данных Redis
  file:
    path: "{{ redis_dir }}"
    state: directory
    owner: redis
    group: redis
    mode: "0750"
  when: ansible_os_family == "Debian"

- name: Записать конфигурацию Redis
  template:
    src: redis.conf.j2
    dest: /etc/redis/redis.conf
    owner: root
    group: redis
    mode: "0640"
  notify: Restart Redis
  when: ansible_os_family == "Debian"

- name: Запустить Redis и включить автозагрузку
  service:
    name: redis-server
    state: started
    enabled: true
  when: ansible_os_family == "Debian"